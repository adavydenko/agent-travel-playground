[tool.ruff]
line-length = 88
target-version = "py311"
src = ["service", "tests", "examples"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "G"]

[tool.mypy]
python_version = "3.11"
files = ["service", "examples"]
mypy_path = ["service", "examples"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
